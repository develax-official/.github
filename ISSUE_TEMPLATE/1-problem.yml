name: 설치·실행 문제 신고
description: 설치가 안 되거나, 명령을 입력했는데 예상과 다르게 동작할 때
labels: ["문제 신고"]
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 감사합니다. 비밀번호, 토큰, 전화번호 같은 개인정보는 적지 말아 주세요. 이 글은 누구나 볼 수 있습니다.
  - type: input
    id: command
    attributes:
      label: 입력한 명령이나 말
      placeholder: 예) /launch, "배포해줘"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 어떤 화면이 나왔나요?
      description: 오류 문구를 그대로 붙여 넣거나 화면 캡처를 끌어다 놓아 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 원래 기대한 결과
  - type: dropdown
    id: os
    attributes:
      label: 운영체제
      options: [Mac, Windows, 기타]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 플러그인 버전(알면)
      description: "/plugin 화면의 develax-starter 옆 숫자. 몰라도 괜찮습니다."
